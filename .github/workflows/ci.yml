name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  frontend:
    name: Frontend — lint, typecheck, build, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

  worker:
    name: Worker — lint, typecheck, build, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  migrations:
    name: Supabase migration check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase
        run: supabase start
      - name: Apply migrations from empty database
        run: supabase db reset
      - name: Lint local database
        run: supabase db lint --local
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
      - name: Apply migrations to Staging (main branch only)
        if: github.ref == 'refs/heads/main'
        run: supabase db push --db-url "${{ secrets.DATABASE_URL }}"

  deploy-frontend:
    name: Deploy frontend to Vercel
    needs: [frontend, worker, migrations]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERCEL_ORG_ID: team_ffnaEgpVX92qTQG7SrYjHHVq
      VERCEL_PROJECT_ID: prj_tCEjR5iJft9etDLFQdwjZOmu5s2J
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deploy preview
        if: github.event_name == 'pull_request' && env.VERCEL_TOKEN != ''
        working-directory: frontend
        run: pnpm dlx vercel@58.9.0 deploy --yes --token "${VERCEL_TOKEN}"
      - name: Deploy production
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.VERCEL_TOKEN != ''
        working-directory: frontend
        run: pnpm dlx vercel@58.9.0 deploy --yes --prod --token "${VERCEL_TOKEN}"
      - name: Vercel not configured
        if: env.VERCEL_TOKEN == ''
        run: echo "Vercel deployment skipped because VERCEL_TOKEN is not configured."

  notify:
    name: Slack notification
    needs: [frontend, worker, migrations, deploy-frontend]
    if: always()
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - uses: slackapi/slack-github-action@v2
        if: env.SLACK_WEBHOOK_URL != ''
        with:
          webhook: ${{ env.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "CI ${{ job.status }} for ${{ github.ref_name }} — ${{ github.event.head_commit.message || github.event.pull_request.title }}"
            }
      - name: Slack not configured
        if: env.SLACK_WEBHOOK_URL == ''
        run: echo "Slack notification skipped because SLACK_WEBHOOK_URL is not configured."

# The worker deploys through Railway's native GitHub integration. Frontend releases are
# deliberately downstream of every CI job above so unvalidated commits cannot be deployed.
