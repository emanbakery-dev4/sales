name: Deploy frontend to Vercel

on:
  workflow_dispatch:
    inputs:
      production:
        description: Deploy to production
        required: true
        default: false
        type: boolean

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_ffnaEgpVX92qTQG7SrYjHHVq
      VERCEL_PROJECT_ID: prj_VL2CjCqMglxTRm0uA8cDwmRzboQM
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deploy the frontend workspace
        working-directory: frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          production_flag=""
          if [[ "${{ inputs.production }}" == "true" ]]; then
            production_flag="--prod"
          fi

          pnpm dlx vercel@latest deploy --yes ${production_flag} --token "${VERCEL_TOKEN}"
