name: Deploy frontend preview

on:
  push:
    branches: [fix/production-deployment]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_ffnaEgpVX92qTQG7SrYjHHVq
      VERCEL_PROJECT_ID: prj_VL2CjCqMglxTRm0uA8cDwmRzboQM
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deploy the frontend workspace
        working-directory: frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: pnpm dlx vercel@latest deploy --yes --token "${VERCEL_TOKEN}"
